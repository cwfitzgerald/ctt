[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["The ctt developers"]
license = "MIT OR Apache-2.0 OR Zlib"

[workspace.lints]

[workspace.dependencies]
ctt = { path = "crates/ctt" }
ctt-intel-texture-compressor = { path = "crates/ctt-intel-texture-compressor" }
thiserror = "2"
ddsfile = "0.5"
ktx2 = "0.3"
clap = { version = "4", features = ["derive"] }
image = "0.25"
