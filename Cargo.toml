[workspace]
members = [
  "crates/*",
  "crates/ctt-intel-texture-compressor/prebuilt",
  "crates/ctt-bc7enc-rdo/prebuilt",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.90"
authors = ["The ctt developers"]
license = "MIT OR Apache-2.0 OR Zlib"
repository = "https://github.com/cwfitzgerald/ctt"

[workspace.lints]

[workspace.dependencies]
ctt = { path = "crates/ctt", version = "0.5", default-features = false }
ctt-intel-texture-compressor = { path = "crates/ctt-intel-texture-compressor", version = "0.5", default-features = false }
ctt-intel-texture-compressor-prebuilt = { path = "crates/ctt-intel-texture-compressor/prebuilt", version = "0.5", default-features = false }
ctt-bc7enc-rdo = { path = "crates/ctt-bc7enc-rdo", version = "0.5", default-features = false }
ctt-bc7enc-rdo-prebuilt = { path = "crates/ctt-bc7enc-rdo/prebuilt", version = "0.5", default-features = false }
ctt-astcenc = { path = "crates/ctt-astcenc", version = "0.5", default-features = false }
ctt-compressonator = { path = "crates/ctt-compressonator", version = "0.5", default-features = false }
ctt-etcpak = { path = "crates/ctt-etcpak", version = "0.5", default-features = false }
ispc-build-utils = { path = "crates/ispc-build-utils", version = "0.5", default-features = false }

anyhow = "1"
bitflags = "2"
bytemuck = "1"
cc = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
ddsfile = "0.6"
facet = "0.46"
facet-reflect = "0.46"
fast_image_resize = "6"
fern = "0.7"
flate2 = "1"
half = { version = "2", features = ["bytemuck"] }
image = { version = "0.25", default-features = false }
ktx2 = { version = "0.5" }
log = "0.4"
miniz_oxide = "0.8"
paste = "1"
profiling = "1"
rayon = "1"
same-file = "1"
tempfile = "3"
thiserror = "2"
zstd = "0.13"

[profile.profiling]
inherits = "release"
debug = true
