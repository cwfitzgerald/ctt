[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
skip = [
  { crate = "getrandom@0.3", reason = "tempfile uses 0.3, jobserver uses 0.4" },
  { crate = "winnow@0.7", reason = "toml uses 0.7, toml_parser uses 1" },
  { crate = "itertools@0.13", reason = "bindgen uses 0.13, rav1e uses 0.14" },
  { crate = "nom@7", reason = "bindgen (via cexpr) uses 7, av1-grain uses 8" },
  { crate = "r-efi@5", reason = "getrandom 0.3 uses 5, getrandom 0.4 uses 6" },
  { crate = "shlex@1", reason = "bindgen uses 1, cc uses 2" },
  { crate = "smallvec@1", reason = "exr uses 1, facet-reflect uses 2" },
  { crate = "syn@2", reason = "transitive proc-macro dependencies use both 2 and 3" },
]
multiple-versions = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "allow"

[advisories]
# paste is unmaintained but pulled in transitively by rav1e; no action we can take
ignore = ["RUSTSEC-2024-0436"]
