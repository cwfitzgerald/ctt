[package]
name = "ctt-intel-texture-compressor-prebuilt"
version.workspace = true
edition.workspace = true
authors = [
  "The ctt developers",
  "Traverse Research <opensource@traverseresearch.nl>",
  "Graham Wihlidal <graham@wihlidal.ca>",
  "Intel Corporation",
]
license = "(MIT OR Apache-2.0) AND MIT"
repository.workspace = true
rust-version.workspace = true
description = "Prebuilt ISPC static libraries for ctt-intel-texture-compressor"
keywords = ["texture", "compression", "ispc", "gpu"]
categories = ["graphics", "compression"]
build = "build.rs"
links = "ispc_tex"
# Ship only the static libraries. The `*.sigstore.jsonl` attestation bundles in
# `bins/` are for CI provenance verification and serve no purpose inside a
# published .crate.
include = ["src/**", "build.rs", "bins/**/*.a", "bins/**/*.lib", "Cargo.toml"]

[build-dependencies]
ispc-build-utils = { workspace = true }

[lints]
workspace = true
