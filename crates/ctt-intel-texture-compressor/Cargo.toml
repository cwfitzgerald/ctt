[package]
name = "ctt-intel-texture-compressor"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors = [
  "The ctt developers",
  "Traverse Research <opensource@traverseresearch.nl>",
  "Graham Wihlidal <graham@wihlidal.ca>",
  "Intel Corporation",
]
license = "(MIT OR Apache-2.0) AND MIT"
rust-version.workspace = true
readme = "../../README.md"
description = "Vendored Intel ISPC texture compressor bindings, based on intel_tex_2"
keywords = ["texture", "compression", "ispc", "gpu"]
categories = ["graphics", "compression"]
build = "build.rs"

[features]
default = ["prebuilt"]
prebuilt = ["dep:ctt-intel-texture-compressor-prebuilt"]
build-from-source = []

[dependencies]
ctt-intel-texture-compressor-prebuilt = { workspace = true, optional = true }

[build-dependencies]
cc = "1"
ispc-build-utils = { workspace = true }

[lints]
workspace = true
