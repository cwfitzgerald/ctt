[package]
name = "ctt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
description = "Compress images to GPU texture formats"
keywords = ["texture", "compression", "gpu", "bc7", "dds"]
categories = ["graphics", "compression"]

[features]
default = ["encoder-ispc", "encoder-bc7enc"]
encoder-ispc = ["dep:ctt-intel-texture-compressor"]
encoder-bc7enc = ["dep:ctt-bc7enc-rdo"]

[dependencies]
ctt-intel-texture-compressor = { workspace = true, optional = true }
ctt-bc7enc-rdo = { workspace = true, optional = true }
ddsfile = { workspace = true }
half = { workspace = true }
ktx2 = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
