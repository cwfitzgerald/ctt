name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_call:

env:
  CI_RUST_VERSION: "1.94"
  CI_RUST_MSRV: "1.90"
  ISPC_VERSION: "1.30.0"
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ispc_asset_suffix: linux
            ispc_ext: tar.gz
            test: true
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ispc_asset_suffix: linux.aarch64
            ispc_ext: tar.gz
            test: true
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ispc_asset_suffix: macOS.arm64
            ispc_ext: tar.gz
            test: true
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            ispc_asset_suffix: macOS.arm64
            ispc_ext: tar.gz
            test: true
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ispc_asset_suffix: windows
            ispc_ext: zip
            test: true
          - name: Windows aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            ispc_asset_suffix: windows
            ispc_ext: zip
            test: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@eea29cff9a2b68892c0845ae3e4f45fc47ee9354 # v2
        with:
          tool: cargo-nextest

      - name: Download ISPC
        shell: bash
        run: |
          ISPC_ASSET="ispc-v${ISPC_VERSION}-${{ matrix.ispc_asset_suffix }}"
          URL="https://github.com/ispc/ispc/releases/download/v${ISPC_VERSION}/${ISPC_ASSET}.${{ matrix.ispc_ext }}"
          curl -L "$URL" -o "ispc_archive.${{ matrix.ispc_ext }}"
          if [[ "${{ matrix.ispc_ext }}" == "zip" ]]; then
            7z x "ispc_archive.zip" -oispc_extracted
          else
            mkdir -p ispc_extracted
            tar xzf ispc_archive.tar.gz -C ispc_extracted
          fi
          echo "$GITHUB_WORKSPACE/ispc_extracted/${ISPC_ASSET}/bin" >> "$GITHUB_PATH"

      # Default features (prebuilt)
      - name: Clippy
        run: cargo clippy --target ${{ matrix.target }} --all-targets

      - name: Build
        run: cargo build --target ${{ matrix.target }}

      - name: Doc
        run: cargo doc --target ${{ matrix.target }} --no-deps

      - name: Test
        if: ${{ matrix.test }}
        run: cargo nextest run --target ${{ matrix.target }}

      - name: Doctest
        if: ${{ matrix.test }}
        run: cargo test --doc --target ${{ matrix.target }}

      # build-from-source
      - name: Clippy (build-from-source)
        run: cargo clippy --target ${{ matrix.target }} --all-targets --workspace --exclude regen-test-data --no-default-features --features ctt-cli/ispc-build-from-source

      - name: Build (build-from-source)
        run: cargo build --target ${{ matrix.target }} --workspace --exclude regen-test-data --no-default-features --features ctt-cli/ispc-build-from-source

      - name: Doc (build-from-source)
        run: cargo doc --target ${{ matrix.target }} --no-deps --workspace --exclude regen-test-data --no-default-features --features ctt-cli/ispc-build-from-source

      - name: Test (build-from-source)
        if: ${{ matrix.test }}
        run: cargo nextest run --target ${{ matrix.target }} --workspace --exclude regen-test-data --no-default-features --features ctt-cli/ispc-build-from-source

      - name: Doctest (build-from-source)
        if: ${{ matrix.test }}
        run: cargo test --doc --target ${{ matrix.target }} --workspace --exclude regen-test-data --no-default-features --features ctt-cli/ispc-build-from-source

  no-prebuilt-in-build-from-source:
    name: No prebuilt in build-from-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_VERSION }}

      - name: Check no prebuilt crates in build-from-source tree
        shell: bash
        run: |
          TREE=$(cargo tree --no-default-features --features ctt-cli/ispc-build-from-source -p ctt-cli)
          if echo "$TREE" | grep -q prebuilt; then
            echo "ERROR: prebuilt crates found in build-from-source dependency tree:"
            echo "$TREE" | grep prebuilt
            exit 1
          fi

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_VERSION }}
          components: rustfmt

      - name: Format
        run: cargo fmt --check

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_VERSION }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@eea29cff9a2b68892c0845ae3e4f45fc47ee9354 # v2
        with:
          tool: cargo-deny

      - name: Deny
        run: cargo deny --all-features check

  verify-attestations:
    name: Verify attestations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_VERSION }}

      - name: Verify binary attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-binaries

  c-header-up-to-date:
    name: C header up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_VERSION }}

      - name: Regenerate C header
        run: cargo xtask generate-c-header

      - name: Check for changes
        shell: bash
        run: |
          if ! git diff --exit-code -- crates/ctt-c-api/include/ctt.h; then
            echo ""
            echo "ERROR: crates/ctt-c-api/include/ctt.h is out of date."
            echo "Run 'cargo xtask generate-c-header' locally and commit the result."
            exit 1
          fi

  build-artifacts:
    name: Build artifacts
    # Tag pushes invoke ci.yml via the publish workflow, which already runs
    # build-artifacts.yml with attestation enabled. Skip here to avoid a
    # duplicate matrix.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-artifacts.yml
    with:
      attest: false
      version: ci-${{ github.sha }}

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      RUSTDOCFLAGS: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_MSRV }}

      - name: Download ISPC
        shell: bash
        run: |
          ISPC_ASSET="ispc-v${ISPC_VERSION}-linux"
          URL="https://github.com/ispc/ispc/releases/download/v${ISPC_VERSION}/${ISPC_ASSET}.tar.gz"
          curl -L "$URL" -o "ispc_archive.tar.gz"
          mkdir -p ispc_extracted
          tar xzf ispc_archive.tar.gz -C ispc_extracted
          echo "$GITHUB_WORKSPACE/ispc_extracted/${ISPC_ASSET}/bin" >> "$GITHUB_PATH"

      - name: Check (default features)
        run: cargo check -p ctt

      - name: Check (no default features)
        run: cargo check -p ctt --no-default-features
