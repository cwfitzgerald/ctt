name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_call:

env:
  CI_RUST_VERSION: "1.94"
  CI_RUST_MSRV: "1.85"
  ISPC_VERSION: "1.30.0"
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ispc_asset_suffix: linux
            ispc_ext: tar.gz
            test: true
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ispc_asset_suffix: linux.aarch64
            ispc_ext: tar.gz
            test: true
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ispc_asset_suffix: macOS.arm64
            ispc_ext: tar.gz
            test: true
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            ispc_asset_suffix: macOS.arm64
            ispc_ext: tar.gz
            test: true
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ispc_asset_suffix: windows
            ispc_ext: zip
            test: true
          - name: Windows aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            ispc_asset_suffix: windows
            ispc_ext: zip
            test: false
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Download ISPC
        shell: bash
        run: |
          ISPC_ASSET="ispc-v${ISPC_VERSION}-${{ matrix.ispc_asset_suffix }}"
          URL="https://github.com/ispc/ispc/releases/download/v${ISPC_VERSION}/${ISPC_ASSET}.${{ matrix.ispc_ext }}"
          curl -L "$URL" -o "ispc_archive.${{ matrix.ispc_ext }}"
          if [[ "${{ matrix.ispc_ext }}" == "zip" ]]; then
            7z x "ispc_archive.zip" -oispc_extracted
          else
            mkdir -p ispc_extracted
            tar xzf ispc_archive.tar.gz -C ispc_extracted
          fi
          echo "$GITHUB_WORKSPACE/ispc_extracted/${ISPC_ASSET}/bin" >> "$GITHUB_PATH"

      - name: Clippy
        run: cargo clippy --target ${{ matrix.target }} --all-targets

      - name: Build
        run: cargo build --target ${{ matrix.target }}

      - name: Doc
        run: cargo doc --target ${{ matrix.target }} --no-deps

      - name: Test
        if: ${{ matrix.test }}
        run: cargo nextest run --target ${{ matrix.target }}

      - name: Doctest
        if: ${{ matrix.test }}
        run: cargo test --doc --target ${{ matrix.target }}

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_VERSION }}
          components: rustfmt

      - name: Format
        run: cargo fmt --check

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_VERSION }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Deny
        run: cargo deny --all-features check

  verify-attestations:
    name: Verify attestations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_VERSION }}

      - name: Verify binary attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-binaries

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      RUSTDOCFLAGS: ""
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_MSRV }}

      - name: Download ISPC
        shell: bash
        run: |
          ISPC_ASSET="ispc-v${ISPC_VERSION}-linux"
          URL="https://github.com/ispc/ispc/releases/download/v${ISPC_VERSION}/${ISPC_ASSET}.tar.gz"
          curl -L "$URL" -o "ispc_archive.tar.gz"
          mkdir -p ispc_extracted
          tar xzf ispc_archive.tar.gz -C ispc_extracted
          echo "$GITHUB_WORKSPACE/ispc_extracted/${ISPC_ASSET}/bin" >> "$GITHUB_PATH"

      - name: Check (default features)
        run: cargo check -p ctt

      - name: Check (no default features)
        run: cargo check -p ctt --no-default-features
