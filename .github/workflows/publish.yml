name: Publish

on:
  push:
    tags: ['v*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-release:
    needs: ci
    permissions:
      id-token: write
      attestations: write
      contents: read
    uses: ./.github/workflows/build-artifacts.yml
    with:
      attest: true
      version: ${{ github.ref_name }}

  publish:
    needs: build-release
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ctt-cli-*.tar.gz
            ctt-cli-*.zip
            ctt-c-api-*.tar.gz
            ctt-c-api-*.zip
          generate_release_notes: true
